name: Schema drift check

on:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch live backend schema
        env:
          BACKEND_ENV: staging
        run: node scripts/sync-schema.mjs
      - name: Fail if vendored schema is out of date
        run: git diff --exit-code schema/openapi.json
