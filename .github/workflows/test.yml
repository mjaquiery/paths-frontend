name: Test

on:
  push:

permissions:
  contents: read

jobs:
  vars:
    runs-on: ubuntu-latest
    outputs:
      playwright_image: ${{ steps.playwright_image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Resolve Playwright container image from package-lock.json
        id: playwright_image
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          echo "image=mcr.microsoft.com/playwright:v${version}-noble" >> "$GITHUB_OUTPUT"

  test:
    needs: vars
    runs-on: ubuntu-latest
    container: ${{ needs.vars.outputs.playwright_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build

  storybook-a11y:
    needs: vars
    runs-on: ubuntu-latest
    container: ${{ needs.vars.outputs.playwright_image }}
    strategy:
      matrix:
        theme: [light, dark]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Storybook a11y tests (${{ matrix.theme }})
        run: npm run test:storybook:ci
        env:
          VITE_TEST_STORYBOOK_THEME: ${{ matrix.theme }}
